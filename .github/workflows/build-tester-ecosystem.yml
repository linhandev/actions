name: Build Tester Ecosystem

on:
  # push:
  #   paths:
  #     - '.github/workflows/build-tester-ecosystem.yml'
  #     - '.github/actions/prepare-rnoh-env/action.yml'
  workflow_call:
    secrets:
      dockerhub_username:
        description: 'DockerHub username'
        required: true
      dockerhub_token:
        description: 'DockerHub token'
        required: true
      signing_config_map:
        description: 'Signing config map'
        required: true
  workflow_dispatch:
  # schedule:
  #   - cron: "0 */6 * * *"

jobs:
  verify-and-build-tester-ecosystem:
    runs-on: ubuntu-latest
    container:
      image: aliaslsrmrf/clt
      credentials:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
    outputs:
      artifact_name: ${{ steps.artifact-name.outputs.artifact_name }}
    steps:
      - name: Fetch workflow file
        uses: actions/checkout@v4
      - name: Prepare RNOH build enviroment
        uses: ./.github/actions/prepare-rnoh-env
      - name: Verify
        run: pnpm verify
      - name: Build tester ecosystem
        run: |
          npx ts-node workflow_utils/update_signing_config.ts packages/tester-ecosystem/harmony/build-profile.json5 com.rnoh.tester '${{ secrets.SIGNING_CONFIG_MAP }}'
          cd packages/tester-ecosystem
          pnpm run test
      - name: Rename artifact
        id: artifact-name
        run: |
          ARTIFACT_NAME="tester-eco-$(git rev-parse HEAD)"
          cp packages/tester-ecosystem/harmony/entry/build/default/outputs/default/entry-default-signed.hap ./"$ARTIFACT_NAME".hap
          echo "artifact_name=${ARTIFACT_NAME}" >> $GITHUB_OUTPUT
      - name: Save built artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact-name.outputs.artifact_name }}
          path: ./${{ steps.artifact-name.outputs.artifact_name }}.hap
  run-ut:
    needs: verify-and-build-tester-ecosystem
    uses: linhandev/actions/.github/workflows/run-ut.yml@develop
    with:
      artifact_name: ${{ needs.verify-and-build-tester-ecosystem.outputs.artifact_name }}
