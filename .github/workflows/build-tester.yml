name: Build Tester

on:
  push:
    paths:
      - '.github/workflows/build-tester.yml'
      - '.github/actions/prepare-rnoh-env/action.yml'
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

jobs:
  build-tester:
    runs-on: ubuntu-latest
    container:
      image: aliaslsrmrf/clt
      credentials:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
    strategy:
      matrix:
        build-mode: [debug] # debug, release
        js-engine: [jsvm] # jsvm, hermes
    outputs:
      artifact_name: ${{ steps.artifact-name.outputs.artifact_name }}
    steps:
      - name: Fetch workflow file
        uses: actions/checkout@v4
      - name: Prepare RNOH build enviroment
        uses: ./.github/actions/prepare-rnoh-env
      - name: Build RN
        run: |
          cd packages/tester
          if [ "${{ matrix.js-engine }}" = "jsvm" ]; then
            pnpm run bundle
          else
            npm run bundle:hermes
          fi
      - name: Build native
        run: |
          # add siging config
          npx ts-node workflow_utils/update_signing_config.ts packages/tester/harmony/build-profile.json5 com.rnoh.tester '${{ secrets.SIGNING_CONFIG_MAP }}'
          # uncomment bundle provider
          if [ "${{ matrix.js-engine }}" = "jsvm" ]; then
            npx ts-node workflow_utils/uncomment.ts packages/tester/harmony/entry/src/main/ets/pages/Index.ets "new ResourceJSBundleProvider(this.rnohCoreContext.uiAbilityContext.resourceManager, 'bundle.harmony.js')"
          else
            npx ts-node workflow_utils/uncomment.ts packages/tester/harmony/entry/src/main/ets/pages/Index.ets "new ResourceJSBundleProvider(this.rnohCoreContext.uiAbilityContext.resourceManager, 'hermes_bundle.hbc'),"
          fi

          cd packages/tester/harmony
          ohpm i
          hvigorw --sync -p product=default --analyze=false --parallel --incremental --no-daemon --debug
          hvigorw --mode module -p module=entry@default -p product=default -p buildMode=${{ matrix.build-mode }} -p requiredDeviceType=phone assembleHap --analyze=false --parallel --incremental --no-daemon --debug
      - name: Rename artifact
        id: artifact-name
        run: |
          ARTIFACT_NAME="tester-$(git rev-parse HEAD)-${{ matrix.js-engine }}-${{ matrix.build-mode }}"
          cp packages/tester/harmony/entry/build/default/outputs/default/entry-default-signed.hap ./"$ARTIFACT_NAME".hap
          echo "ARTIFACT_NAME=$ARTIFACT_NAME" >> $GITHUB_ENV
          echo "artifact_name=${ARTIFACT_NAME}" >> $GITHUB_OUTPUT
      - name: Save built artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ./${{ env.ARTIFACT_NAME }}.hap
      - name: Trigger run-hap
        uses: ./.github/workflows/run-hap.yml
        with:
          artifact_name: ${{ env.ARTIFACT_NAME }}

  verify-and-build-tester-ecosystem:
    runs-on: ubuntu-latest
    container:
      image: aliaslsrmrf/clt
      credentials:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - name: Fetch workflow file
        uses: actions/checkout@v4
      - name: Prepare RNOH build enviroment
        uses: ./.github/actions/prepare-rnoh-env
      - name: Verify
        run: pnpm verify
      - name: Build tester ecosystem
        run: |
          npx ts-node workflow_utils/update_signing_config.ts packages/tester-ecosystem/harmony/build-profile.json5 com.rnoh.tester '${{ secrets.SIGNING_CONFIG_MAP }}'
          cd packages/tester-ecosystem
          pnpm run test
      - name: Rename artifact
        run: |
          ARTIFACT_NAME="tester-eco-$(git rev-parse HEAD)"
          cp packages/tester-ecosystem/harmony/entry/build/default/outputs/default/entry-default-signed.hap ./"$ARTIFACT_NAME".hap
          echo "ARTIFACT_NAME=$ARTIFACT_NAME" >> $GITHUB_ENV
      - name: Save built artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ./${{ env.ARTIFACT_NAME }}.hap
