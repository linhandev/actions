name: Build Tester

on:
  push:
    paths:
      - '.github/workflows/build-tester.yml'
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

jobs:
  build-tester:
    runs-on: ubuntu-latest
    container:
      image: aliaslsrmrf/clt
      credentials:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    strategy:
      matrix:
        build-mode: [debug, release] # Add more modes as needed
    steps:
      - run: whoami
      - name: Fetch workflow file
        uses: actions/checkout@v4
      - name: Prepare RNOH build enviroment
        uses: ./.github/actions/prepare-rnoh-env
      - name: Build tester
        run: |
          cd packages/tester/harmony
          ohpm i
          hvigorw --sync -p product=default --analyze=false --parallel --incremental --no-daemon --debug
          hvigorw --mode module -p module=entry@default -p product=default -p buildMode=${{ matrix.build-mode }} -p requiredDeviceType=phone assembleHap --analyze=false --parallel --incremental --no-daemon --debug
      - name: Rename artifact
        run: |
          ARTIFACT_NAME="tester-$(git rev-parse HEAD)-${{ matrix.build-mode }}"
          cp packages/tester/harmony/entry/build/default/outputs/default/entry-default-signed.hap ./"$ARTIFACT_NAME".hap
          echo "ARTIFACT_NAME=$ARTIFACT_NAME" >> $GITHUB_ENV
      - name: Save built artifact
        uses: actions/upload-artifact@v4
        with:
          name: $ARTIFACT_NAME
          path: ./"$ARTIFACT_NAME".hap
      - name: Recover workflow files for post steps
        uses: actions/checkout@v4

  build-tester-ecosystem:
    runs-on: ubuntu-latest
    container:
      image: aliaslsrmrf/clt
    steps:
      - name: Fetch workflow file
        uses: actions/checkout@v4
      - name: Prepare RNOH build enviroment
        uses: ./.github/actions/prepare-rnoh-env
      - name: Build tester ecosystem
        run: |
          cd packages/tester-ecosystem
          pnpm run test
      - name: Rename artifact
        run: |
          ARTIFACT_NAME="tester-eco-$(git rev-parse HEAD)"
          cp packages/tester-ecosystem/harmony/entry/build/default/outputs/default/entry-default-signed.hap ./"$ARTIFACT_NAME".hap
          echo "ARTIFACT_NAME=$ARTIFACT_NAME" >> $GITHUB_ENV
      - name: Save built artifact
        uses: actions/upload-artifact@v4
        with:
          name: $ARTIFACT_NAME
          path: ./"$ARTIFACT_NAME".hap
      - name: Recover workflow file for post steps
        uses: actions/checkout@v4
  