name: Sync rnoh from gitee to github

on:
  workflow_dispatch:
  # schedule:
  #   - cron: "0 */6 * * *"

# Ensures that only one mirror task will run at a time.
concurrency:
  group: sync-rnoh

jobs:
  git-mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: linhandev/git-mirror-action@master
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        with:
          source-repo: "git@gitcode.com:openharmony-sig/ohos_react_native.git"
          destination-repo: "git@github.com:linhandev/ohos_react_native.git"
          branches: "master,0.77.1-rc.1-ohos"
