name: Sync rnoh from gitee to github

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

# Ensures that only one mirror task will run at a time.
concurrency:
  group: sync-rnoh

jobs:
  git-mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Sync rnoh from gitcode to github
        uses: Yikun/hub-mirror-action@master
        with:
          src: gitee/openharmony-sig
          dst: github/linhandev
          dst_key: ${{ secrets.SSH_PRIVATE_KEY }}
          dst_token: ""
          static_list: "ohos_react_native"
