name: Build llvm

on:
  workflow_dispatch:

jobs:
  build:
    # strategy:
    #   matrix:
    #     os: [macos-13, macos-15]
    # runs-on: ${{ matrix.os }}
    runs-on: macos-13
    steps:
      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "14.3.1"
      - name: Check env
        run: |
          uname -m
          xcodebuild -version
          python --version
          python3 --version

      - name: Install dependencies
        run: |
          brew install swig java coreutils wget # git-lfs

      - name: git setup
        run: |
          git config --global --add safe.directory '*'
          git config --global user.email "you@example.com"
          git config --global user.name "Your Name"

      - name: Install repo tool
        run: |
          curl https://gitee.com/oschina/repo/raw/fork_flow/repo-py3 > /tmp/repo
          chmod u+x /tmp/repo
          pip install requests

      - name: Repo init and sync
        run: |
          /tmp/repo init -u https://gitee.com/OpenHarmony/manifest.git -b master -m llvm-19.1.7-toolchain.xml
          /tmp/repo sync -c
          /tmp/repo forall -c 'git lfs pull'

      - name: Prepare environment
        run: |
          ./toolchain/llvm-project/llvm-build/env_prepare.sh

      - name: Build
        run: |
          python3 ./toolchain/llvm-project/llvm-build/build.py --no-build-riscv64 --no-build-mipsel --no-build-loongarch64 --no-build windows

      - name: Upload packages folder
        uses: actions/upload-artifact@v4
        with:
          name: packages
          path: packages
