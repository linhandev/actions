name: Build llvm

on:
  workflow_dispatch:

jobs:
  build:
    # strategy:
    #   matrix:
    #     os: [macos-13, macos-15]
    # runs-on: ${{ matrix.os }}
    runs-on: macos-13
    steps:
      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
            xcode-version: '14.3.1'
      - name: Check env
        run: |
          uname -m
          xcodebuild -version

      - name: Install dependencies
        run: |
          brew install swig git-lfs java coreutils wget

      - name: Repo init and sync
        run: |
          repo init -u https://gitee.com/OpenHarmony/manifest.git -b master -m llvm-19.1.7-toolchain.xml
          repo sync -c
          repo forall -c 'git lfs pull'

      - name: Prepare environment
        run: |
          ./toolchain/llvm-project/llvm-build/env_prepare.sh

      - name: Build
        run: |
          python3 ./toolchain/llvm-project/llvm-build/build.py --no-build-riscv64 --no-build-mipsel --no-build-loongarch64 --no-build windows