name: Run hap

on:
  workflow_dispatch:
    inputs:
      artifact_name:
        description: The name of the HAP artifact to run
        required: true
        type: string
        default: "tester-010105d2faa76b8f8c4845562e4b177f45a6dce6-jsvm-debug"
      bundle_name:
        description: The bundle name of the hap, eg com.rnoh.tester
        required: false
        type: string
        default: "com.rnoh.tester"
  workflow_call:
    inputs:
      artifact_name:
        required: true
        type: string
      bundle_name:
        required: false
        type: string
        default: "com.rnoh.tester"
concurrency:
  group: run-hap

jobs:
  test-hap:
    runs-on: self-hosted
    steps:
      - name: Setup Env
        run: |
          echo "PATH=$PATH:~/Desktop/software/command-line-tools/sdk/default/openharmony/toolchains/" >> $GITHUB_ENV
      - name: Download HAP artifact
        if: github.event_name != 'workflow_dispatch'
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
      - name: Install HAP
        if: github.event_name != 'workflow_dispatch'
        run: |
          hdc list targets
          wget 
          hdc install ${{ inputs.artifact_name }}.hap
      - name: Install hap for local debug
        if: github.event_name == 'workflow_dispatch'
        run: |
          hdc install /home/user/Desktop/tester-010105d2faa76b8f8c4845562e4b177f45a6dce6-jsvm-debug.hap
      - name: Run unittest
        run: |
          hdc shell aa test -b ${{ inputs.artifact_name }} -m entry_test -s unittest OpenHarmonyTestRunner -s class tester -s timeout 60000
