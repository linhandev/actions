name: Run hap

on:
  workflow_dispatch:
    inputs:
      artifact_name:
        description: The name of the HAP artifact to run
        required: true
        type: string
        default: "tester-010105d2faa76b8f8c4845562e4b177f45a6dce6-jsvm-debug"
  workflow_call:
    inputs:
      artifact_name:
        required: true
        type: string
        
concurrency:
  group: run-hap

jobs:
  test-hap:
    runs-on: self-hosted
    steps:
      - name: Setup Env
        run: |
          echo "PATH=$PATH:~/Desktop/software/command-line-tools/sdk/default/openharmony/toolchains/" >> $GITHUB_ENV
      - run: |
          hdc list targets
      - name: Download HAP artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}

      - name: Install HAP
        run: |
          hdc install ${{ inputs.artifact_name }}.hap
