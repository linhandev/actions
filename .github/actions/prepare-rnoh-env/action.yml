name: Prepare RNOH build environment
description: Prepare RNOH build environment
runs:
  using: "composite"
  steps:
    - name: Checkout ohos_react_native
      uses: actions/checkout@v4
      with:
        repository: linhandev/ohos_react_native
        ref: 0.77.1-rc.1-ohos
        path: code_temp

    - name: Move ohos_react_native to root
      shell: bash
      run: |
        rm -rf package.json .gitignore README.md tsconfig.json .git
        shopt -s dotglob
        mv -n code_temp/* .
        rmdir code_temp

    - name: Install pnpm
      uses: pnpm/action-setup@v4

    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: 'pnpm'
    
    - name: Config git and npm dep
      shell: bash
      run: |
        git config --global --add safe.directory "$GITHUB_WORKSPACE"
        touch ~/.npmrc
        bash workflow_utils/install_deps.sh
        ARTIFACT_NAME="tester-eco-$(git rev-parse HEAD)"
        echo $ARTIFACT_NAME

    - name: Change submodule origin
      shell: bash
      run: |
        sed -i 's|https://gl.swmansion.com/rnoh/react-native-core.git|https://github.com/linhandev/react-native-core.git|g' .gitmodules
        # dont show progress to avoid too much log
        sed -i 's|git submodule update --init --recursive --progress|git submodule update --init --recursive|g' package.json

    - name: Cache git submodules
      uses: actions/cache@v4
      with:
        path: |
          .git/modules
          packages/tester/harmony/react_native_openharmony/src/main/cpp/third-party/{boost,double-conversion,fmt,glog,libevent,fast_float,folly,hermes}
        key: ${{ runner.os }}-submodules-${{ hashFiles('.gitmodules') }}
        restore-keys: |
          ${{ runner.os }}-submodules-

    - name: init-ws
      run: pnpm init-ws
      shell: bash
